name: Feature request
description: 提议符合轻量、本地优先方向的增强
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，不要只描述按钮或技术方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 阅读体验
        - 文件打开/保存
        - Markdown 渲染
        - DOCX/PDF/XLSX 导出
        - Windows 原生集成
        - 性能或可访问性
        - 开发与文档
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: 产品边界
      options:
        - label: 该方案不要求默认上传 Markdown 正文。
          required: true
        - label: 该方案不会无理由扩大文件系统或 Shell 权限。
          required: true
