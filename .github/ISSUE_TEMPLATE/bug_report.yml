name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除文档中的个人信息、密钥和内部路径。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - GitHub Release 安装包
        - npm run tauri dev
        - 本地 release 构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、确定的步骤和必要的脱敏 Markdown。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请勿上传敏感文档或漏洞利用细节。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复报告。
          required: true
        - label: 我已删除个人信息、密钥和未授权内容。
          required: true
